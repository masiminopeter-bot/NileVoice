version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nilevoice_web:prod
    restart: always
    env_file:
      - .env.production
    depends_on:
      - db
    expose:
      - "8000"
    networks:
      - nilevoice_network
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - 8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --workers
      - "4"

  nginx:
    image: nginx:1.26-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - nilevoice_network
    restart: always

  db:
    image: mysql:8.0
    container_name: nilevoice_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO=1
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nilevoice_network

volumes:
  db_data:

networks:
  nilevoice_network:
    driver: bridge
