version: "3.9"

services:
  web:
    build: .
    container_name: nilevoice_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: nilevoice_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nilevoice
      MYSQL_USER: nilevoice
      MYSQL_PASSWORD: supersecret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
