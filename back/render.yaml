services:
  - type: web
    name: nilevoice-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_NAME
        value: NileVoice AI
      - key: APP_VERSION
        value: 1.0.0
      - key: APP_ENV
        value: production
      - key: DB_HOST
        value: your-render-database-host
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: your-db-user
      - key: DB_PASSWORD
        value: your-db-password
      - key: DB_NAME
        value: nilevoice
      - key: JWT_SECRET_KEY
        value: replace-with-strong-secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: EMAIL_VERIFICATION_TOKEN_EXPIRE_HOURS
        value: 48
      - key: PASSWORD_RESET_TOKEN_EXPIRE_HOURS
        value: 2
